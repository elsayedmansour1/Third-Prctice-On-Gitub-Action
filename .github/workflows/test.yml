name: Test and lint and Deployment
on: push
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Get the Code
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                    node-version: 18
            - name: Install Dependencies
              run: npm ci # installs packages exactly as specified in package-lock.json

            - name: Run ESLint
              run: npx eslint . # runs your local eslint setup
            - name: run the Lint
              run:
                npm run lint
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get the Code
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                    node-version: 18
            - name: Install Dependencies
              run: npm ci # installs packages exactly as specified in package-lock.json

            - name: run the test
              run:
                npm run test
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Get the Code
              uses: actions/checkout@v7
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                    node-version: 18
            - name: Install Dependencies
              run: npm ci # installs packages exactly as specified in package-lock.json

            - name: run the build
              run:
                npm run build
            - name: Deployment
              run: echo "deploying......"
        